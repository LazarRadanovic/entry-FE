server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  # REST API -> backend
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # STOMP over WebSocket -> backend
  location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Service worker files and the shell must never be cached by the browser
  location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|index\.html)$ {
    add_header Cache-Control "no-cache";
  }

  # Hashed build output can be cached forever
  location ~* \.(js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
